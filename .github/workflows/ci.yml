name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format, vet, test
        run: make check

      # The plugin is a C shared library, so the build is a real check of its
      # own: a broken cgo signature only shows up here, never in `go test`.
      - name: Build the shared library
        run: make build

      - uses: actions/upload-artifact@v5
        with:
          name: glm-quota-linux-amd64
          path: dist/linux/amd64/glm-quota.so
          if-no-files-found: error
